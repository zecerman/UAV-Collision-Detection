# config/drone_lstm.yaml

default_settings:
  trainer_type: ppo
  hyperparameters:
    batch_size: 2048
    buffer_size: 131072
    learning_rate: 3.0e-4
    beta: 3.0e-3       
    epsilon: 0.2
    lambd: 0.95
    num_epoch: 3
    learning_rate_schedule: linear
    sequence_length: 64
  network_settings:
    normalize: true
    hidden_units: 256 
    num_layers: 3
    memory:
      use_recurrent: true
      memory_size: 256
      sequence_length: 64
  reward_signals:
    extrinsic:
      gamma: 0.995
      strength: 1.0
  time_horizon: 256       
  max_steps: 1.0e7
  summary_freq: 10000

behaviors:
  drone_goal: {}
    network_settings:
      memory:
        use_recurrent: true
        memory_size: 256
        sequence_length: 64
